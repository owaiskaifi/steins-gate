<!DOCTYPE html>
<html>
<head>
  <title>Steins Gate - Array Trend Predictor API</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
  body {
    background-color: #26292E;
    color: #2E2F30;
    font-family: sans-serif;
    margin: 0;
  }

  footer {
    position: absolute;
    bottom: 1%;
    width: 100%;
    text-align: center;
    font-size: .6em;
    color: #fff
  }

  a {
    color: #fff;
  }

  a:hover {
    color: #e74c3c;
  }

  .dialog {
    float:right;
    text-align: left;
    width: 60%;
    margin: 5% auto 0;
  }

  h1 { 
    font-size: 4em;
    color: #fff;
    line-height: 1em;
  }

  p {
    font-size: 1.4em;
    color: #fff;
    padding-right: 5%;
  }
  
  .code {
    background: rgba(255, 255, 255, 0.1);
    padding: 0.5rem;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.9em;
  }
  
  .image {
    position: absolute;
    float: left;
    top: 0;
    width:60%;
  }
  
  @media only screen and (max-width: 767px) {
    .image {
      width: 100%;
      top: -50px;
    }
    .dialog {
      float:none;
      text-align: center;
      width: 90%;
      margin-top: 70%
    }
  }  
  </style>
</head>

<body>
  <img src="light-bulb.png" class="image">
  <div>
    <div class="dialog">
      <h1>🔮 Steins Gate API</h1>
      <p>
        Array Trend Predictor - Send a POST request with JSON data to get trend predictions.
      </p>
      <p class="code">
        POST https://steins--gate.herokuapp.com/predict<br>
        {"arr": [1, 2, 3, 4, 5]}
      </p>
      <p>
        Returns one of: NO_COUNT, INCREASE, DECREASE, STABLE, or VARIANCE
      </p>
    </div>
  </div> 
</body>
<footer>
    <a href="https://www.github.com/owaiskaifi">GitHub</a> | 
    <a href="https://github.com/owaiskaifi/steins-gate">Documentation</a>
</footer>
</html>
